name: Publish MCP registry

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: Require the tag to match server.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(jq -r '.version' server.json)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server.json version $version"
            exit 1
          fi

      - name: Skip a version already in the registry
        id: registry
        run: |
          version=$(jq -r '.version' server.json)
          path=$(jq -r '"/v0/servers/\(.name|@uri)/versions/\(.version|@uri)"' server.json)
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io${path}")
          if [ "$code" = "200" ]; then
            echo "Version $version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Registry lookup for $version returned HTTP $code"
            exit 1
          fi

      - name: Install cosign
        if: steps.registry.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.publish == 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "MCP_PRIVATE_KEY is empty"
            exit 1
          fi
          ./mcp-publisher login http --domain mcp.workast.com --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
